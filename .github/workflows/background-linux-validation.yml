name: Background runner Linux validation

on:
  push:
    branches: [release/codex-background-validation]

permissions:
  contents: read

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade setuptools
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:focused
